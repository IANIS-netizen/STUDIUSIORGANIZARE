<div id="talk5-toolbar" style="position:fixed;top:10px;right:10px;z-index:9999;">

<!-- ECRAN COMPLET NOTIȚE (reutilizat de Cuvântare 5 min și Cuvântare 30 min) -->
<div id="noteFullscreenOverlay" class="page-fullscreen">
  <div class="top-bar">
    <button onclick="closeFullscreenNote()">← Înapoi</button>
    <h2 id="noteFullscreenTitle">Notițe</h2>
  </div>
  <div id="noteFullscreenSlot" style="display:flex;flex:1;min-height:0"></div>
</div>

<!-- TELEPROMPTER (reutilizat de Cuvântare 5 minute și Cuvântare Publică 30 minute) -->
<div id="teleprompterOverlay" class="teleprompter-overlay">
  <div class="teleprompter-topbar">
    <button id="teleprompterPlayBtn" class="teleprompter-btn teleprompter-btn-play" onclick="teleprompterPlay()">▶ Play</button>
    <button id="teleprompterPauseBtn" class="teleprompter-btn" onclick="teleprompterPause()" disabled>⏸ Pauză</button>
    <label class="teleprompter-slider-label">Viteză
      <input type="range" id="teleprompterSpeed" min="1" max="30" value="8" oninput="changeTeleprompterSpeed(this.value)" />
      <span id="teleprompterSpeedValue">8</span>
    </label>
    <label class="teleprompter-slider-label">Mărime
      <input type="range" id="teleprompterFontSize" min="20" max="90" value="40" oninput="changeTeleprompterFontSize(this.value)" />
      <span id="teleprompterFontSizeValue">40</span>
    </label>
    <span id="teleprompterTitle" class="teleprompter-title">Cuvântare</span>
    <button class="teleprompter-btn teleprompter-btn-close" onclick="closeTeleprompter()">✕ Ieși</button>
  </div>
  <div id="teleprompterContainer" class="teleprompter-container">
    <div id="teleprompterText" class="teleprompter-text"></div>
    <div class="teleprompter-spacer"></div>
    <div class="teleprompter-fade teleprompter-fade-top"></div>
    <div class="teleprompter-fade teleprompter-fade-bottom"></div>
  </div>
</div>

<!-- BUTON INSTALARE PWA (apare doar pe Android/Chrome, când aplicația e instalabilă) -->
<button id="pwaInstallBtn">
  <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>Instalează aplicația</span>
</button>

</div>
