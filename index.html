<script>
(function () {
  'use strict';

  const htmlModules = [
    { target: 'body', path: 'html/layout-sidebar.html', position: 'afterbegin' },
    { target: '#mainContent', path: 'html/layout-topbar.html' },
    { target: '#mainContent', path: 'html/acasa.html' },
    { target: '#mainContent', path: 'html/asistent-ai.html' },

    { target: '#mainContent', path: 'html/turnul-de-veghe.html' },

    { target: '#mainContent', path: 'html/tema-cursant.html' },
    { target: '#mainContent', path: 'html/caiet-intrunire.html' },
    { target: '#mainContent', path: 'html/cuvantare-5-minute.html' },
    { target: '#mainContent', path: 'html/cuvantare-10-minute.html' },
    { target: '#mainContent', path: 'html/citeste-biblia.html' },
    { target: '#mainContent', path: 'html/biblioteca.html' },
    { target: '#mainContent', path: 'html/biblioteca-pdf.html' },
    { target: '#mainContent', path: 'html/studiu-biblic.html' },
    { target: '#mainContent', path: 'html/serviciu-teren.html' },
    { target: '#mainContent', path: 'html/programare-teren.html' },
    { target: '#mainContent', path: 'html/programare-stand.html' },
    { target: '#mainContent', path: 'html/asistent-predicare.html' },
    { target: '#mainContent', path: 'html/vestitor.html' },
    { target: '#mainContent', path: 'html/notite.html' },
    { target: '#mainContent', path: 'html/calendar-intruniri.html' },
    { target: 'body', path: 'html/setari.html' },
    { target: 'body', path: 'html/transfer.html' },
    { target: 'body', path: 'html/toast.html' },
    { target: 'body', path: 'html/suprapuneri-pwa.html' }
  ];

  const appScripts = [
    {"src":"js/study/verse-of-day.local.js","optionalMessage":"verse-of-day.local.js nu exista - Versetul Zilei porneste gol."},
    {"src":"js/core/storage.js"},
    {"src":"js/core/utils.js"},
    {"src":"https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js","optionalMessage":"PeerJS nu s-a incarcat - trimiterea directa poate fi indisponibila offline."},
    {"src":"js/core/navigation.js"},
    {"src":"js/core/dashboard.js"},

    {"src":"js/study/wtStudy.js"},
    {"src":"js/study/workbook.js"},
    {"src":"js/study/temacursant.js"},
    {"src":"js/study/verses.js"},
    {"src":"js/study/prophecies.js"},
    {"src":"js/field-service/fieldServiceUI.js"},
    {"src":"js/meetings/icsExport.js"},
    {"src":"js/field-service/fieldScheduling.js"},
    {"src":"js/field-service/standScheduling.js"},
    {"src":"js/field-service/vestitor.js"},
    {"src":"js/field-service/fieldService.js"},
    {"src":"js/study/library.js"},
    {"src":"js/study/pdfLibrary.js"},
    {"src":"js/study/notes.js"},
    {"src":"js/meetings/meetings.js"},
    {"src":"js/study/search.js"},
    {"src":"js/core/theme.js"},
    {"src":"js/study/bibleReader.js"},
    {"src":"js/study/bibleHighlight.js"},
    {"src":"js/core/dataIO.js"},
    {"src":"js/core/settings.js"},
    {"src":"js/meetings/discursTimer.js"},
    {"src":"js/meetings/talkTimer.js"},
    {"src":"js/meetings/talkTimer10.js"},
    {"src":"js/core/fontScale.js"},
    {"src":"js/meetings/wordCounter.js"},
    {"src":"js/core/transfer.js"},
    {"src":"js/core/notifications.js"},
    {"src":"js/core/asistentAI.js"},
    {"src":"js/core/app.js"}
  ];

  function loadHtmlModule(module) {
    return fetch(module.path, { cache: 'no-cache' })
      .then((response) => {
        if (!response.ok) throw new Error(module.path + ' (' + response.status + ')');
        return response.text();
      })
      .then((html) => {
        const target = document.querySelector(module.target);
        if (!target) throw new Error('Container lipsa pentru ' + module.path + ': ' + module.target);
        target.insertAdjacentHTML(module.position || 'beforeend', html);
      });
  }

  function loadScript(definition) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = definition.src;
      script.onload = resolve;
      script.onerror = () => {
        if (definition.optionalMessage) {
          console.info(definition.optionalMessage);
          resolve();
        } else {
          reject(new Error('Nu s-a putut incarca scriptul: ' + definition.src));
        }
      };
      document.body.appendChild(script);
    });
  }

  window.__studiuMeuHtmlReady = htmlModules.reduce((chain, module) => chain.then(() => loadHtmlModule(module)), Promise.resolve())
    .then(() => appScripts.reduce((chain, script) => chain.then(() => loadScript(script)), Promise.resolve()))
    .catch((error) => {
      console.error('Eroare la incarcarea aplicatiei StudiuMeu:', error);
      throw error;
    });
}());
</script>

<script>
window.__studiuMeuHtmlReady.then(() => {
  let deferredInstallPrompt = null;
  const pwaInstallBtn = document.getElementById('pwaInstallBtn');
  if (!pwaInstallBtn) return;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    pwaInstallBtn.style.display = 'flex';
  });

  pwaInstallBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    pwaInstallBtn.style.display = 'none';
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    pwaInstallBtn.style.display = 'none';
    deferredInstallPrompt = null;
  });

  // Ascunde butonul daca aplicatia ruleaza deja instalata (standalone)
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    pwaInstallBtn.style.display = 'none';
  }
});
</script>

</body>
</html>
